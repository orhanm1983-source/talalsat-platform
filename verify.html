<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفعيل الحساب - منصة TALALSAT</title>
<style>
  :root {
    --primary: #2b6cb0;
    --primary-hover: #1a4975;
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
    --text-color: #2d3748;
    --border-color: #e2e8f0;
  }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: var(--bg-color); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    color: var(--text-color); 
  }
  .card { 
    background: var(--card-bg); 
    padding: 36px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
    width: 400px; 
    border: 1px solid var(--border-color); 
    text-align: center;
  }
  h2 {
    color: var(--primary);
    margin-bottom: 10px;
  }
  p {
    font-size: 14px;
    color: #718096;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  input { 
    width: 100%; 
    padding: 13px 15px; 
    margin: 15px 0; 
    border: 1px solid var(--border-color); 
    border-radius: 10px; 
    box-sizing: border-box; 
    font-size: 20px; 
    text-align: center;
    letter-spacing: 5px;
    background: #f8fafc; 
    transition: all 0.2s;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.12);
  }
  button { 
    width: 100%; 
    padding: 12px; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 10px; 
    cursor: pointer; 
    font-size: 15px; 
    font-weight: 700; 
    transition: background 0.2s;
  }
  button:hover { background: var(--primary-hover); }
</style>
</head>
<body>

<div class="card">
  <h2>تفعيل الحساب</h2>
  <p>الرجاء إدخال رمز التحقق (6 أرقام) الذي تم إرساله إلى بريدك الإلكتروني</p>
  
  <input id="verificationCodeInput" type="text" placeholder="123456" maxlength="6">
  <button type="button" onclick="verifyAccount()">تفعيل الحساب</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvAPQ8w0anK6CkmLJuHjNMSlSf4trf0cU",
    authDomain: "talalsat-platform.firebaseapp.com",
    projectId: "talalsat-platform",
    storageBucket: "talalsat-platform.firebasestorage.app",
    messagingSenderId: "463319836026",
    appId: "1:463319836026:web:55cff426cc874cc8d062c3",
    measurementId: "G-NJ8R5QNP9H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // استخراج البريد الإلكتروني المرسل عبر الرابط
  const urlParams = new URLSearchParams(window.location.search);
  const email = urlParams.get('email');

  window.verifyAccount = async function() {
    let enteredCode = document.getElementById("verificationCodeInput").value.trim();

    if (!enteredCode) {
      alert("يرجى إدخال رمز التفعيل");
      return;
    }

    if (!email) {
      alert("رابط التحقق غير صالح، يرجى إعادة تسجيل الدخول.");
      window.location.href = "login.html";
      return;
    }

    try {
      const q = query(collection(db, "users"), where("email", "==", email));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        let userDocRef = querySnapshot.docs[0].ref;
        let userData = querySnapshot.docs[0].data();

        // مطابقة الكود المدخل مع المخزن في قاعدة البيانات
        if (userData.code === enteredCode) {
          await updateDoc(userDocRef, {
            status: "active",
            code: "" // مسح الرمز بعد استخدامه بنجاح
          });

          alert("تم تفعيل حسابك بنجاح! يمكنك الآن تسجيل الدخول.");
          window.location.href = "login.html";
        } else {
          alert("رمز التفعيل غير صحيح، يرجى المحاولة مرة أخرى.");
        }
      } else {
        alert("لم يتم العثور على الحساب المرتبط بهذا البريد.");
      }
    } catch (e) {
      alert("حدث خطأ أثناء الاتصال بقاعدة البيانات: " + e.message);
    }
  }
</script>

</body>
</html>
