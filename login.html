<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول والإنشاء - منصة TALALSAT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #2b6cb0;
    --primary-hover: #1a4975;
    --accent: #319795;
    --danger: #e53e3e;
    --success: #38a169;
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
    --radius-sm: 10px;
    --radius-md: 16px;
    --shadow-soft: 0 10px 30px -5px rgba(43, 108, 176, 0.08);
  }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: var(--bg-color); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    color: #2d3748;
  }
  .auth-container {
    background: var(--card-bg);
    padding: 30px 40px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
    width: 380px;
    border: 1px solid var(--border-color);
  }
  .logo-container {
    text-align: center;
    margin-bottom: 15px;
  }
  .logo-container img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(43, 108, 176, 0.15);
  }
  h2 { color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 22px; }
  label { font-size: 13px; font-weight: bold; display: block; margin-top: 10px; }
  input { 
    width: 100%; 
    padding: 12px 15px; 
    margin: 8px 0 15px 0; 
    display: block; 
    border: 1px solid var(--border-color); 
    border-radius: var(--radius-sm); 
    box-sizing: border-box; 
    font-size: 14px; 
    background: #f8fafc; 
  }
  input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.12); }
  button { 
    width: 100%; 
    padding: 12px; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: var(--radius-sm); 
    font-weight: 700; 
    font-size: 15px; 
    cursor: pointer; 
    transition: background 0.2s; 
    margin-top: 5px;
  }
  button:hover { background: var(--primary-hover); }
  .switch-text { text-align: center; margin-top: 15px; font-size: 13.5px; color: #718096; }
  .switch-text a { color: var(--primary); text-decoration: none; font-weight: bold; cursor: pointer; }
  .switch-text a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-container">
  <!-- نموذج تسجيل الدخول -->
  <div id="loginFormSection">
    <div class="logo-container">
      <img src="logo (2).png" alt="شعار منصة TALALSAT">
    </div>
    <h2>تسجيل الدخول</h2>
    
    <label>البريد الإلكتروني:</label>
    <input id="loginEmail" type="email" placeholder="example@gmail.com">
    
    <label>كلمة المرور:</label>
    <input id="loginPassword" type="password" placeholder="••••••••">
    
    <button onclick="loginUser()">دخول</button>
    <div class="switch-text">
      ليس لديك حساب؟ <a onclick="toggleForms()">إنشاء حساب جديد</a>
    </div>
  </div>

  <!-- نموذج إنشاء حساب جديد -->
  <div id="registerFormSection" style="display: none;">
    <div class="logo-container">
      <img src="logo (2).png" alt="شعار منصة TALALSAT">
    </div>
    <h2>إنشاء حساب طالب</h2>
    
    <label>الاسم الكامل:</label>
    <input id="regName" type="text" placeholder="أدخل اسمك الثلاثي">

    <label>البريد الإلكتروني:</label>
    <input id="regEmail" type="email" placeholder="example@gmail.com">
    
    <label>كلمة المرور:</label>
    <input id="regPassword" type="password" placeholder="••••••••">
    
    <button onclick="registerUser()" style="background: var(--accent);">تسجيل حساب جديد</button>
    <div class="switch-text">
      لديك حساب بالفعل؟ <a onclick="toggleForms()">تسجيل الدخول</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvAPQ8w0anK6CkmLJuHjNMSlSf4trf0cU",
    authDomain: "talalsat-platform.firebaseapp.com",
    projectId: "talalsat-platform",
    storageBucket: "talalsat-platform.firebasestorage.app",
    messagingSenderId: "463319836026",
    appId: "1:463319836026:web:55cff426cc874cc8d062c3",
    measurementId: "G-NJ8R5QNP9H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.toggleForms = function() {
    let loginSec = document.getElementById("loginFormSection");
    let regSec = document.getElementById("registerFormSection");
    if (loginSec.style.display === "none") {
      loginSec.style.display = "block";
      regSec.style.display = "none";
    } else {
      loginSec.style.display = "none";
      regSec.style.display = "block";
    }
  }

  // تسجيل حساب جديد مع منع تكرار البريد الإلكتروني أو الاسم
  window.registerUser = async function() {
    let name = document.getElementById("regName").value.trim();
    let email = document.getElementById("regEmail").value.trim();
    let password = document.getElementById("regPassword").value.trim();

    if (!name || !email || !password) {
      alert("يرجى تعبئة جميع الحقول المطلوبة.");
      return;
    }

    try {
      const emailQuery = query(collection(db, "users"), where("email", "==", email));
      const emailSnap = await getDocs(emailQuery);
      if (!emailSnap.empty) {
        alert("خطأ: هذا البريد الإلكتروني مسجل مسبقاً بحساب آخر! يرجى استخدام بريد مختلف.");
        return;
      }

      const nameQuery = query(collection(db, "users"), where("name", "==", name));
      const nameSnap = await getDocs(nameQuery);
      if (!nameSnap.empty) {
        alert("خطأ: هذا الاسم مسجل مسبقاً! يرجى إضافة اسم العائلة أو اسم مميز.");
        return;
      }

      let verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
      
      await addDoc(collection(db, "users"), {
        name: name,
        email: email,
        password: password,
        role: "student",
        isPaid: false,
        status: "pending",
        verificationCode: verificationCode,
        createdAt: Date.now()
      });

      alert("تم إنشاء الحساب بنجاح! رمز التحقق الخاص بك هو: " + verificationCode);
      location.href = `verify.html?email=${encodeURIComponent(email)}`;
      
    } catch (e) {
      alert("حدث خطأ أثناء التسجيل: " + e.message);
    }
  };

  // تسجيل الدخول
  window.loginUser = async function() {
    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
      alert("يرجى إدخال البريد وكلمة المرور.");
      return;
    }

    try {
      const adminDoc = await getDoc(doc(db, "settings", "adminCredentials"));
      let adminData = adminDoc.exists() ? adminDoc.data() : { email: "admin@talalacademy.com", password: "123" };

      if (email === adminData.email && password === adminData.password) {
        let adminUser = { name: "المدير", email: adminData.email, role: "admin", isPaid: true };
        localStorage.setItem("currentUser", JSON.stringify(adminUser));
        location.href = "admin.html";
        return;
      }

      const q = query(collection(db, "users"), where("email", "==", email), where("password", "==", password));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        let userData = null;
        querySnapshot.forEach((docSnap) => {
          userData = { id: docSnap.id, ...docSnap.data() };
        });

        localStorage.setItem("currentUser", JSON.stringify(userData));
        location.href = "index.html";
      } else {
        alert("بيانات الدخول غير صحيحة أو الحساب غير مسجل.");
      }
    } catch (e) {
      alert("خطأ في الاتصال بقاعدة البيانات: " + e.message);
    }
  };
</script>

</body>
</html>
