<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - منصة TALALSAT</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  :root {
    --primary: #2b6cb0;
    --primary-hover: #2c5282;
    --accent: #319795;
    --bg-color: #f7fafc;
    --card-bg: #ffffff;
    --text-color: #2d3748;
    --border-color: #e2e8f0;
  }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: var(--text-color); }
  .card { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); width: 380px; border: 1px solid var(--border-color); }
  .logo-title { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 28px; font-weight: bold; letter-spacing: 0.5px; }
  .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); }
  .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: #718096; transition: all 0.3s ease; }
  .tab.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
  .form-group { display: none; }
  .form-group.active { display: block; }
  input { width: 100%; padding: 12px 15px; margin: 10px 0; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #f8fafc; transition: all 0.2s; }
  input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1); }
  button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 15px; transition: background 0.2s; }
  button:hover { background: var(--primary-hover); }
  .btn-accent { background: var(--accent); }
  .btn-accent:hover { background: #2c7a7b; }
  .verify-box { display: none; background: #edf2f7; padding: 15px; border-radius: 8px; margin-top: 15px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-title">TALALSAT</div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
    <div class="tab" onclick="switchTab('register')">حساب جديد</div>
  </div>

  <div id="loginForm" class="form-group active">
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
    <input id="loginPassword" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
  </div>

  <div id="registerForm" class="form-group">
    <input id="regName" type="text" placeholder="الاسم الكامل">
    <input id="regEmail" type="email" placeholder="البريد الإلكتروني">
    <input id="regPassword" type="password" placeholder="كلمة المرور">
    <button id="btnSendCode" class="btn-accent" onclick="sendVerificationCode()">إرسال كود التفعيل</button>

    <div id="verifyBox" class="verify-box">
      <p style="margin:0 0 10px 0; font-size:13px; color:#4a5568;">تم إرسال كود التفعيل إلى بريدك الإلكتروني:</p>
      <input id="inputCode" type="text" placeholder="أدخل كود التفعيل">
      <button onclick="verifyAndRegister()" style="background:#3182ce;">تأكيد وتفعيل الحساب</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvAPQ8w0anK6CkmLJuHjNMSlSf4trf0cU",
    authDomain: "talalsat-platform.firebaseapp.com",
    projectId: "talalsat-platform",
    storageBucket: "talalsat-platform.firebasestorage.app",
    messagingSenderId: "463319836026",
    appId: "1:463319836026:web:55cff426cc874cc8d062c3",
    measurementId: "G-NJ8R5QNP9H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  (function(){
     emailjs.init("kaJmN11jIcapGxZSh");
  })();

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
    
    if(tab === 'login') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    }
  }

  let generatedCode = null;
  window.sendVerificationCode = async function() {
    let email = document.getElementById("regEmail").value.trim();
    let name = document.getElementById("regName").value.trim();
    let password = document.getElementById("regPassword").value.trim();

    if (!name || !email || !password) {
      alert("يرجى إكمال كافة البيانات أولاً");
      return;
    }

    try {
      const q = query(collection(db, "users"), where("email", "==", email));
      const querySnapshot = await getDocs(q);
      if (!querySnapshot.empty) {
        alert("هذا البريد مسجل مسبقاً!");
        return;
      }
    } catch(e) {
      console.log(e);
    }

    generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
    sessionStorage.setItem("pendingVerificationCode", generatedCode);

    let templateParams = {
        from_name: "منصة TALALSAT",
        message: "كود التفعيل الخاص بالحساب الجديد هو: " + generatedCode + "\nالاسم: " + name + "\nالبريد: " + email
    };

    emailjs.send("service_oq1o551", "template_my0rh1i", templateParams)
    .then(() => {
        alert("تم إرسال كود التفعيل إلى بريدك الإلكتروني بنجاح!");
        document.getElementById("verifyBox").style.display = "block";
        document.getElementById("btnSendCode").style.display = "none";
    })
    .catch(err => {
        alert("حدث خطأ أثناء إرسال الكود عبر الإيميل، الكود التجريبي: " + generatedCode);
        document.getElementById("verifyBox").style.display = "block";
        document.getElementById("btnSendCode").style.display = "none";
    });
  }

  window.verifyAndRegister = async function() {
    let userCode = document.getElementById("inputCode").value.trim();
    let savedCode = sessionStorage.getItem("pendingVerificationCode");

    if (!userCode || userCode !== savedCode) {
      alert("كود التفعيل غير صحيح!");
      return;
    }

    let email = document.getElementById("regEmail").value.trim();
    let name = document.getElementById("regName").value.trim();
    let password = document.getElementById("regPassword").value.trim();

    let newUser = { name, email, password, role: "student", status: "active" };

    try {
      await addDoc(collection(db, "users"), newUser);
      localStorage.setItem("currentUser", JSON.stringify(newUser));
      sessionStorage.removeItem("pendingVerificationCode");
      alert("تم تفعيل حسابك بنجاح!");
      location.href = "index.html";
    } catch (e) {
      alert("حدث خطأ أثناء حفظ الحساب: " + e.message);
    }
  }

  window.login = async function() {
    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
      alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
      return;
    }

    if (email === "admin@talalacademy.com" && password === "123") {
      let adminUser = { name: "المدير", role: "admin", email: email };
      localStorage.setItem("currentUser", JSON.stringify(adminUser));
      location.href = "admin.html";
      return;
    }

    try {
      const q = query(collection(db, "users"), where("email", "==", email), where("password", "==", password));
      const querySnapshot = await getDocs(q);
      
      if (!querySnapshot.empty) {
        let userData = querySnapshot.docs[0].data();
        localStorage.setItem("currentUser", JSON.stringify(userData));
        location.href = "index.html";
      } else {
        alert("البريد الإلكتروني أو كلمة المرور غير صحيحة.");
      }
    } catch (e) {
      alert("خطأ في الاتصال بقاعدة البيانات.");
    }
  }
</script>
</body>
</html>
